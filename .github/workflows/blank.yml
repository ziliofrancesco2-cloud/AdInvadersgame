name: Compila APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai il progetto dallo zip
        run: |
          unzip -q "AdInvaders (1).zip" -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila
        run: cd "$PROJ" && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AdInvaders-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
