name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai il progetto dallo zip
        run: |
          unzip -q "AdInvaders (1).zip" -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV

      - name: Applica aggiornamenti (tablet + navicella sui siti)
        run: |
          if [ -f adinv.patch ]; then patch -p1 -d "$PROJ" < adinv.patch; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila
        run: |
          cd "$PROJ" && gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AdInvaders.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AdInvaders-apk
          path: AdInvaders.apk

      - name: Pubblica download pubblico
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ad Invaders ${{ github.run_number }}
          make_latest: true
          files: AdInvaders.apk
